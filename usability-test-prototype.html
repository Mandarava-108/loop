<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Loop — Test Runner Prototype</title>
<style>
  :root{
    --chrome-bg:#14161B;
    --chrome-raised:#1D2027;
    --chrome-border:#2B2F38;
    --ink:#EDEFF3;
    --ink-dim:#9AA1AD;
    --accent:#7C6FF0;
    --accent-soft:rgba(124,111,240,.16);
    --ok:#4ECF9A;
    --panel-w:340px;
    --sheet-collapsed:64px;
    --radius:14px;
    font-size:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--chrome-bg);
    color:var(--ink);
    overflow:hidden;
  }

  /* ---------- layout ---------- */
  .app{display:flex;height:100dvh;width:100%}
  .site-pane{flex:1;position:relative;background:#fff}
  .site-pane iframe{width:100%;height:100%;border:0;display:block}

  /* top bar over the site, mimics a session header */
  .session-bar{
    position:absolute;top:0;left:0;right:0;height:40px;
    display:flex;align-items:center;gap:10px;padding:0 14px;
    background:linear-gradient(to bottom,rgba(20,22,27,.92),rgba(20,22,27,.78));
    color:var(--ink-dim);font-size:.78rem;letter-spacing:.02em;
    backdrop-filter:blur(6px);
    pointer-events:none;
  }
  .rec-dot{width:8px;height:8px;border-radius:50%;background:#F0605A;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .session-bar .url{margin-left:auto;font-family:ui-monospace,monospace;opacity:.8}

  /* ---------- task panel (shared) ---------- */
  .panel{
    background:var(--chrome-bg);
    display:flex;flex-direction:column;
    border-left:1px solid var(--chrome-border);
    width:var(--panel-w);flex:none;
  }
  .panel-head{
    padding:18px 20px 14px;border-bottom:1px solid var(--chrome-border);
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:.95rem;letter-spacing:.01em}
  .brand-mark{width:18px;height:18px;border-radius:50%;border:3px solid var(--accent);border-right-color:transparent;transform:rotate(-45deg)}
  .progress-wrap{margin-top:14px}
  .progress-label{display:flex;justify-content:space-between;font-size:.75rem;color:var(--ink-dim);margin-bottom:6px}
  .progress-track{height:4px;background:var(--chrome-border);border-radius:2px;overflow:hidden}
  .progress-fill{height:100%;width:0%;background:var(--accent);border-radius:2px;transition:width .4s cubic-bezier(.4,0,.2,1)}

  .panel-body{flex:1;overflow-y:auto;padding:20px}
  .task-eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:650;margin-bottom:8px}
  .task-title{font-size:1.06rem;font-weight:650;line-height:1.35;margin-bottom:8px}
  .task-desc{font-size:.88rem;line-height:1.55;color:var(--ink-dim);margin-bottom:20px}

  .answer label{display:block;font-size:.8rem;color:var(--ink-dim);margin-bottom:8px}
  textarea{
    width:100%;min-height:88px;resize:vertical;
    background:var(--chrome-raised);border:1px solid var(--chrome-border);
    border-radius:10px;color:var(--ink);padding:12px;font:inherit;font-size:.88rem;line-height:1.5;
  }
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}

  .scale{display:flex;gap:8px;margin-top:4px}
  .scale button{
    flex:1;height:44px;border-radius:10px;border:1px solid var(--chrome-border);
    background:var(--chrome-raised);color:var(--ink);font:inherit;font-size:.95rem;cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .scale button:hover{border-color:var(--accent)}
  .scale button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:#fff}
  .scale-ends{display:flex;justify-content:space-between;font-size:.72rem;color:var(--ink-dim);margin-top:6px}

  .panel-foot{padding:16px 20px;border-top:1px solid var(--chrome-border)}
  .btn{
    width:100%;height:46px;border:0;border-radius:11px;cursor:pointer;
    background:var(--accent);color:#fff;font:inherit;font-size:.92rem;font-weight:600;
    transition:filter .15s;
  }
  .btn:hover{filter:brightness(1.1)}
  .btn:disabled{opacity:.4;cursor:default;filter:none}
  .btn.ghost{background:transparent;color:var(--ink-dim);height:auto;margin-top:8px;font-weight:500;font-size:.8rem}
  .btn.ghost:hover{color:var(--ink)}

  .done{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 8px}
  .done-ring{width:56px;height:56px;border-radius:50%;background:rgba(78,207,154,.14);display:grid;place-items:center;margin-bottom:16px}
  .done-ring svg{width:26px;height:26px;stroke:var(--ok);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .done h2{font-size:1.05rem;margin-bottom:6px}
  .done p{font-size:.85rem;color:var(--ink-dim);line-height:1.5}

  /* drag handle + collapse toggle: hidden on desktop */
  .sheet-grip{display:none}

  /* ---------- mobile: bottom sheet ---------- */
  @media (max-width:768px){
    .app{flex-direction:column}
    .panel{
      width:100%;border-left:0;border-top:1px solid var(--chrome-border);
      position:fixed;left:0;right:0;bottom:0;z-index:20;
      border-radius:18px 18px 0 0;
      box-shadow:0 -12px 32px rgba(0,0,0,.45);
      height:var(--sheet-collapsed);
      transition:height .32s cubic-bezier(.4,0,.2,1);
      padding-bottom:env(safe-area-inset-bottom);
    }
    .panel.expanded{height:min(72dvh,540px)}
    .site-pane{padding-bottom:var(--sheet-collapsed)}

    .sheet-grip{
      display:flex;flex-direction:column;align-items:stretch;
      cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
      border:0;background:none;color:inherit;font:inherit;text-align:left;width:100%;
      padding:8px 18px 10px;
    }
    .grip-bar{width:38px;height:4px;border-radius:2px;background:var(--chrome-border);margin:0 auto 10px}
    .grip-row{display:flex;align-items:center;gap:10px;min-width:0}
    .grip-step{
      flex:none;font-size:.7rem;font-weight:700;color:var(--accent);
      background:var(--accent-soft);border-radius:6px;padding:3px 7px;letter-spacing:.04em;
    }
    .grip-title{flex:1;font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .grip-chev{flex:none;transition:transform .3s}
    .grip-chev svg{width:16px;height:16px;stroke:var(--ink-dim);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block}
    .panel.expanded .grip-chev{transform:rotate(180deg)}

    .panel-head{display:none}
    .panel-body{opacity:0;pointer-events:none;transition:opacity .2s}
    .panel-foot{opacity:0;pointer-events:none;transition:opacity .2s}
    .panel.expanded .panel-body,.panel.expanded .panel-foot{opacity:1;pointer-events:auto;transition-delay:.12s}

    .m-progress{height:3px;background:var(--chrome-border);border-radius:2px;overflow:hidden;margin-top:10px}
    .m-progress div{height:100%;background:var(--accent);width:0%;transition:width .4s}
  }
  @media (min-width:769px){
    .m-progress{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<div class="app">

  <div class="site-pane">
    <div class="session-bar">
      <span class="rec-dot"></span> Recording session
      <span class="url">verdant-demo.shop</span>
    </div>
    <iframe id="siteFrame" title="Website under test"></iframe>
  </div>

  <aside class="panel" id="panel">
    <!-- mobile grip -->
    <button class="sheet-grip" id="grip" aria-expanded="false" aria-controls="panelBody">
      <span class="grip-bar"></span>
      <span class="grip-row">
        <span class="grip-step" id="gripStep">1/4</span>
        <span class="grip-title" id="gripTitle">Find a plant for a dark room</span>
        <span class="grip-chev"><svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg></span>
      </span>
      <span class="m-progress"><div id="mProgress"></div></span>
    </button>

    <div class="panel-head">
      <div class="brand"><span class="brand-mark"></span> Loop · Session preview</div>
      <div class="progress-wrap">
        <div class="progress-label"><span id="stepLabel">Task 1 of 4</span><span id="pctLabel">0%</span></div>
        <div class="progress-track"><div class="progress-fill" id="dProgress"></div></div>
      </div>
    </div>

    <div class="panel-body" id="panelBody"></div>

    <div class="panel-foot" id="panelFoot">
      <button class="btn" id="nextBtn">Next task</button>
      <button class="btn ghost" id="skipBtn">Skip this task</button>
    </div>
  </aside>
</div>

<script>
/* ---------------- mock website under test (srcdoc) ---------------- */
const demoSite = `
<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{box-sizing:border-box;margin:0}
  body{font-family:Georgia,'Times New Roman',serif;color:#28311F;background:#F7F6F0;padding-top:40px}
  header{padding:20px 22px;display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #E2E0D5;background:#F7F6F0;position:sticky;top:0}
  header h1{font-size:1.3rem;letter-spacing:.02em}
  header nav{margin-left:auto;font-family:ui-sans-serif,system-ui;font-size:.8rem;display:flex;gap:16px}
  header nav a{color:#5B6B4A;text-decoration:none}
  .cart{font-family:ui-sans-serif,system-ui;font-size:.8rem;background:#2F4327;color:#F7F6F0;border-radius:999px;padding:6px 12px}
  .hero{padding:34px 22px 10px}
  .hero h2{font-size:1.7rem;font-weight:500;max-width:22ch;line-height:1.25}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:22px}
  .card{background:#fff;border:1px solid #E2E0D5;border-radius:10px;overflow:hidden;font-family:ui-sans-serif,system-ui}
  .swatch{height:110px}
  .card .info{padding:10px 12px 12px}
  .card h3{font-size:.85rem;font-weight:600;margin-bottom:2px}
  .card p{font-size:.72rem;color:#7B8470;margin-bottom:8px}
  .card button{width:100%;border:1px solid #2F4327;background:none;color:#2F4327;border-radius:7px;padding:7px 0;font-size:.75rem;cursor:pointer}
  .card button.added{background:#2F4327;color:#fff}
</style></head><body>
<header><h1>Verdant</h1><nav><a href="#">Shop</a><a href="#">Care guides</a></nav><span class="cart" id="cart">Cart · 0</span></header>
<div class="hero"><h2>Houseplants chosen for the light you actually have.</h2></div>
<div class="grid" id="grid"></div>
<script>
  const plants=[["ZZ Plant","Thrives in low light","#5B6B4A"],["Snake Plant","Low light, low effort","#3E5238"],["Monstera","Bright, indirect light","#6E8B5E"],["Pothos","Adapts to shade","#7FA06B"],["Fiddle-Leaf Fig","Needs bright light","#8FA97C"],["Cast Iron Plant","Happy in dark corners","#465C3B"]];
  let n=0;
  document.getElementById('grid').innerHTML=plants.map(function(p,i){
    return '<div class="card"><div class="swatch" style="background:'+p[2]+'"></div><div class="info"><h3>'+p[0]+'</h3><p>'+p[1]+'</p><button onclick="add(this)">Add to cart</button></div></div>';
  }).join('');
  function add(b){n++;document.getElementById('cart').textContent='Cart · '+n;b.textContent='Added ✓';b.className='added';}
<\/script>
</body></html>`;
document.getElementById('siteFrame').srcdoc = demoSite;

/* ---------------- test flow ---------------- */
const tasks = [
  {
    eyebrow:"Task 1",
    title:"Find a plant for a dark room",
    desc:"Imagine your apartment gets very little sunlight. Browse the store and find a plant you'd buy for a dim corner.",
    input:null
  },
  {
    eyebrow:"Task 2",
    title:"Add it to your cart",
    desc:"Add the plant you chose to the cart. Notice whether the confirmation is clear enough.",
    input:null
  },
  {
    eyebrow:"Question",
    title:"How easy was that?",
    desc:"Rate how easy it was to find and add a suitable plant.",
    input:"scale"
  },
  {
    eyebrow:"Question",
    title:"What would you change?",
    desc:"In your own words: what, if anything, felt confusing or slow?",
    input:"text"
  }
];

let current = 0;
let answers = {};

const panel   = document.getElementById('panel');
const grip    = document.getElementById('grip');
const body    = document.getElementById('panelBody');
const foot    = document.getElementById('panelFoot');
const nextBtn = document.getElementById('nextBtn');
const skipBtn = document.getElementById('skipBtn');

function render(){
  const t = tasks[current];
  const pct = Math.round((current / tasks.length) * 100);
  document.getElementById('dProgress').style.width = pct + '%';
  document.getElementById('mProgress').style.width = pct + '%';
  document.getElementById('stepLabel').textContent = 'Task ' + (current+1) + ' of ' + tasks.length;
  document.getElementById('pctLabel').textContent  = pct + '%';
  document.getElementById('gripStep').textContent  = (current+1) + '/' + tasks.length;
  document.getElementById('gripTitle').textContent = t.title;

  let inputHtml = '';
  if (t.input === 'scale'){
    inputHtml = `<div class="answer"><label>Tap a rating</label>
      <div class="scale" id="scale">` +
      [1,2,3,4,5].map(v=>`<button aria-pressed="false" data-v="${v}">${v}</button>`).join('') +
      `</div><div class="scale-ends"><span>Very hard</span><span>Very easy</span></div></div>`;
  } else if (t.input === 'text'){
    inputHtml = `<div class="answer"><label>Your answer</label>
      <textarea id="freeText" placeholder="Type your thoughts…"></textarea></div>`;
  }

  body.innerHTML = `
    <div class="task-eyebrow">${t.eyebrow}</div>
    <div class="task-title">${t.title}</div>
    <div class="task-desc">${t.desc}</div>
    ${inputHtml}`;

  if (t.input === 'scale'){
    nextBtn.disabled = true;
    body.querySelectorAll('#scale button').forEach(b=>{
      b.addEventListener('click', ()=>{
        body.querySelectorAll('#scale button').forEach(x=>x.setAttribute('aria-pressed','false'));
        b.setAttribute('aria-pressed','true');
        answers[current] = b.dataset.v;
        nextBtn.disabled = false;
      });
    });
  } else if (t.input === 'text'){
    nextBtn.disabled = true;
    const ta = body.querySelector('#freeText');
    ta.addEventListener('input', ()=>{
      answers[current] = ta.value;
      nextBtn.disabled = ta.value.trim().length === 0;
    });
    ta.addEventListener('focus', ()=> panel.classList.add('expanded'));
  } else {
    nextBtn.disabled = false;
  }
  nextBtn.textContent = current === tasks.length - 1 ? 'Finish test' : (t.input ? 'Submit' : 'Done — next task');
}

function renderDone(){
  document.getElementById('dProgress').style.width = '100%';
  document.getElementById('mProgress').style.width = '100%';
  document.getElementById('pctLabel').textContent = '100%';
  document.getElementById('stepLabel').textContent = 'Complete';
  document.getElementById('gripStep').textContent = '✓';
  document.getElementById('gripTitle').textContent = 'Test complete — thank you!';
  body.innerHTML = `
    <div class="done">
      <div class="done-ring"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <h2>That's everything</h2>
      <p>Your responses and session recording have been saved. You can close this window.</p>
    </div>`;
  foot.style.display = 'none';
  panel.classList.add('expanded');
}

nextBtn.addEventListener('click', ()=>{
  current++;
  if (current >= tasks.length){ renderDone(); return; }
  render();
});
skipBtn.addEventListener('click', ()=>{
  answers[current] = '(skipped)';
  current++;
  if (current >= tasks.length){ renderDone(); return; }
  render();
});

/* mobile sheet toggle */
grip.addEventListener('click', ()=>{
  const open = panel.classList.toggle('expanded');
  grip.setAttribute('aria-expanded', open);
});

render();
</script>
</body>
</html>
